<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caesar Predict V2</title>
<style>
:root{--bg:#03150e;--p:#08251a;--p2:#0b3021;--line:#1b5a40;--t:#f4fff8;--m:#9ebdb0;--a:#42e58b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#03150e,#02100a);color:var(--t);font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px 14px 40px}
header{display:flex;justify-content:space-between;align-items:start;gap:12px;padding:14px 3px}.brand h1{margin:0;font-size:30px}.brand p{margin:6px 0;color:var(--m)}.badge{border:1px solid var(--line);border-radius:99px;padding:8px 11px;color:var(--a);font-size:12px;white-space:nowrap}
.controls{display:flex;gap:8px;overflow:auto;padding:12px 0}.controls input{min-width:220px;flex:1;background:var(--p);border:1px solid var(--line);color:var(--t);border-radius:11px;padding:12px}button{border:1px solid var(--line);background:var(--p);color:var(--t);border-radius:11px;padding:11px 14px;white-space:nowrap}button.active,button.primary{background:var(--a);color:#062012;font-weight:700}
.title{display:flex;justify-content:space-between;align-items:end;margin:18px 2px 10px}.title h2{margin:0;font-size:21px}.title span{color:var(--m);font-size:12px}
#matches{display:grid;gap:13px}.card{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:16px}.league{font-size:12px;color:var(--m);margin-bottom:13px}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;text-align:center}.team{font-weight:700;font-size:17px}.team img{width:46px;height:46px;object-fit:contain;display:block;margin:0 auto 8px}.vs{color:var(--m);font-size:12px}
.main{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:15px}.box{background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:13px}.green{color:var(--a);font-weight:700}.bars{display:grid;gap:8px;margin-top:10px}.bar{display:grid;grid-template-columns:48px 1fr 42px;gap:7px;align-items:center;font-size:12px}.track{height:8px;background:#173e2d;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--a)}.confidence{display:inline-block;margin-top:8px;padding:5px 8px;border-radius:8px;background:#123d2b;color:var(--a);font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:9px;background:#092a1d;border-radius:10px}.stat small{color:var(--m)}.stat b{display:block;margin-top:4px}.analyze{width:100%;margin-top:12px}.extra{display:none;margin-top:10px}.extra.open{display:block}.detailgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.detail{background:#092a1d;border-radius:10px;padding:10px;font-size:12px;line-height:1.45}.detail h4{margin:0 0 7px;color:var(--m)}.form{display:flex;gap:4px;margin-top:7px}.form i{font-style:normal;width:20px;height:20px;display:grid;place-items:center;border-radius:5px;font-size:10px;background:#17412f}.form .w{background:#1c9b5c}.form .d{background:#6d6a32}.form .l{background:#743c43}.top-picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.pick{background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:12px}.pick small{color:var(--m)}.pick b{display:block;margin-top:5px}.pick span{display:inline-block;margin-top:6px;color:var(--a);font-size:12px}.empty{text-align:center;padding:28px;color:var(--m);background:var(--p);border-radius:16px}.foot{color:var(--m);font-size:11px;line-height:1.5;margin-top:22px}
@media(max-width:700px){header{display:block}.badge{display:inline-block;margin-top:10px}.main,.detailgrid,.top-picks{grid-template-columns:1fr}.team{font-size:15px}}
</style></head>
<body><div class="wrap">
<header><div class="brand"><h1>⚽ Caesar Predict <sup style="font-size:14px;color:var(--a)">V2</sup></h1><p>Smarter predictions. More match data.</p></div><div id="status" class="badge">● CONNECTING</div></header>
<div class="controls"><input id="search" placeholder="Search teams or leagues…"><button id="refresh">↻ Refresh</button><button class="active" data-league="">All</button><button data-league="39">Premier League</button><button data-league="140">La Liga</button><button data-league="2">Champions League</button></div>
<section id="topPicks" class="top-picks"></section><div class="title"><h2>🔥 Today's Predictions</h2><span id="count"></span></div><main id="matches"><div class="empty">Loading today's matches…</div></main>
<div class="foot">Predictions are statistical estimates, not guarantees. Detailed form and H2H analysis loads on demand to reduce API requests.</div>
</div>
<script>
const statusEl=document.getElementById("status"),matchesEl=document.getElementById("matches"),searchEl=document.getElementById("search"),countEl=document.getElementById("count"),topPicksEl=document.getElementById("topPicks"),refreshBtn=document.getElementById("refresh");let league="",rows=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct=v=>Number.isFinite(Number(v))?Math.round(Number(v)):0;
function conf(p){let a=[pct(p.home),pct(p.draw),pct(p.away)].sort((x,y)=>y-x)[0];return a>=65?"HIGH":a>=50?"MEDIUM":"LOW"}
function bestBet(p,m){if(!p)return "Prediction unavailable";let opts=[{n:"Home Win",v:pct(p.home)},{n:"Draw",v:pct(p.draw)},{n:"Away Win",v:pct(p.away)}].sort((x,y)=>y.v-x.v);return opts[0].v?opts[0].n+" · "+opts[0].v+"%":"Prediction available"}
function form(x){if(!x?.length)return "";return '<div class="form">'+x.slice(0,5).map(r=>`<i class="${r==="W"?"w":r==="D"?"d":"l"}">${r}</i>`).join("")+"</div>"}
function render(){let q=searchEl.value.toLowerCase().trim(),f=rows.filter(m=>(m.home+" "+m.away+" "+m.league).toLowerCase().includes(q));countEl.textContent=f.length+" matches";if(!f.length){topPicksEl.innerHTML="";matchesEl.innerHTML='<div class="empty">No matching fixtures found.</div>';return}
let picks=f.filter(m=>m.prediction).map(m=>({m,v:Math.max(pct(m.prediction.home),pct(m.prediction.draw),pct(m.prediction.away))})).sort((x,y)=>y.v-x.v).slice(0,3);topPicksEl.innerHTML=picks.length?`<div class="title" style="grid-column:1/-1;margin:8px 2px 0"><h2>⭐ Top Picks</h2><span>Highest API prediction percentages</span></div>${picks.map(x=>`<div class="pick"><small>${esc(x.m.league)}</small><b>${esc(x.m.home)} vs ${esc(x.m.away)}</b><span>${esc(bestBet(x.m.prediction,x.m))} · ${conf(x.m.prediction)} confidence band</span></div>`).join("")}`:"";
matchesEl.innerHTML=f.map(m=>{let p=m.prediction,h=p?pct(p.home):0,d=p?pct(p.draw):0,a=p?pct(p.away):0;return `<article class="card"><div class="league">${esc(m.league)} · ${esc(m.status||"")}</div><div class="teams"><div class="team">${m.homeLogo?`<img src="${esc(m.homeLogo)}" alt="">`:""}${esc(m.home)}${form(m.formHome)}</div><div class="vs">${esc(m.time||"")}<br><b>VS</b></div><div class="team">${m.awayLogo?`<img src="${esc(m.awayLogo)}" alt="">`:""}${esc(m.away)}${form(m.formAway)}</div></div><div class="main"><div class="box"><div class="green">🤖 AI Prediction</div>${p?`<div class="bars"><div class="bar"><span>Home</span><div class="track"><div class="fill" style="width:${h}%"></div></div><b>${h}%</b></div><div class="bar"><span>Draw</span><div class="track"><div class="fill" style="width:${d}%"></div></div><b>${d}%</b></div><div class="bar"><span>Away</span><div class="track"><div class="fill" style="width:${a}%"></div></div><b>${a}%</b></div></div><div style="margin-top:10px;font-weight:700">${esc(p.advice||p.winner||"Prediction available")}</div><span class="confidence">${conf(p)} CONFIDENCE</span>`:"Prediction unavailable"}</div><div class="box"><div class="grid"><div class="stat"><small>Best bet</small><b>${esc(bestBet(p,m))}</b></div><div class="stat"><small>Over/Under</small><b>${p?.underOver?esc(p.underOver):"—"}</b></div><div class="stat"><small>Expected goals</small><b>${p?.goals?.home??"—"} - ${p?.goals?.away??"—"}</b></div><div class="stat"><small>Home form</small><b>${m.formHome?m.formHome.join(""):"—"}</b></div><div class="stat"><small>Away form</small><b>${m.formAway?m.formAway.join(""):"—"}</b></div></div></div></div><button class="primary analyze" data-id="${m.id}">Analyze match</button><div class="extra" id="extra-${m.id}"></div></article>`}).join("");
document.querySelectorAll(".analyze").forEach(b=>b.onclick=()=>analyze(b.dataset.id,b))}
async function load(){statusEl.textContent="● LOADING LIVE DATA";try{let u=league?`/api/matches?league=${league}`:"/api/matches",r=await fetch(u,{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"Server error");rows=d;statusEl.textContent="● LIVE DATA CONNECTED";render()}catch(e){statusEl.textContent="● CONNECTION ERROR";matchesEl.innerHTML=`<div class="empty">Could not load matches.<br><small>${esc(e.message)}</small></div>`}}
async function analyze(id,b){let x=document.getElementById("extra-"+id);if(x.classList.contains("open")){x.classList.remove("open");b.textContent="Analyze match";return}b.disabled=true;b.textContent="Loading analysis…";x.innerHTML='<div class="detail">Loading form, H2H and goal data…</div>';x.classList.add("open");try{let r=await fetch(`/api/analyze?fixture=${id}`),d=await r.json();if(!r.ok)throw Error(d.error||"Analysis failed");x.innerHTML=`<div class="detailgrid"><div class="detail"><h4>📈 Team Form</h4>${esc(d.home.name)}: ${esc(d.home.formText)}<br>${esc(d.away.name)}: ${esc(d.away.formText)}</div><div class="detail"><h4>🤝 H2H</h4>${esc(d.h2h.summary)}</div><div class="detail"><h4>⚽ Goals</h4>${esc(d.home.goalsText)}<br>${esc(d.away.goalsText)}</div><div class="detail"><h4>🎯 BTTS</h4>${esc(d.h2h.btts)}</div><div class="detail"><h4>🔢 Correct Score</h4>${esc(d.correctScore)}</div><div class="detail"><h4>🧠 Model Note</h4>${esc(d.note)}</div></div>`;b.textContent="Hide analysis"}catch(e){x.innerHTML=`<div class="detail">Analysis unavailable: ${esc(e.message)}</div>`;b.textContent="Try again"}b.disabled=false}
refreshBtn.onclick=()=>load();
document.querySelectorAll("[data-league]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-league]").forEach(x=>x.classList.remove("active"));b.classList.add("active");league=b.dataset.league;load()});searchEl.oninput=render;load();
</script></body></html>
