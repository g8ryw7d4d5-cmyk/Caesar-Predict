<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caesar Predict</title><style>:root{--bg:#061a12;--panel:#0c281c;--text:#f4fff8;--muted:#9db8aa;--line:#1e4936;--accent:#56d98b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#061a12,#04130d);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:20px 14px 40px}header{padding:18px 4px 12px}h1{margin:0;font-size:30px}.sub{color:var(--muted);margin-top:6px}.status{display:inline-block;margin-top:12px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--muted)}.status.ok{color:var(--accent)}.filters{display:flex;gap:8px;overflow:auto;padding:10px 0 16px}button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 14px;white-space:nowrap}button.active{background:var(--accent);color:#062012;font-weight:700}#matches{display:grid;gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.league{font-size:12px;color:var(--muted);margin-bottom:12px}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}.team{font-weight:700}.team img{width:38px;height:38px;object-fit:contain;display:block;margin:0 auto 7px}.time{font-size:12px;color:var(--muted)}.pred{margin-top:15px;border-top:1px solid var(--line);padding-top:14px}.bars{display:grid;gap:8px}.barrow{display:grid;grid-template-columns:54px 1fr 44px;gap:8px;align-items:center;font-size:13px}.track{height:9px;background:#173c2c;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--accent)}.advice{margin-top:12px;font-weight:700}.empty{padding:30px;text-align:center;color:var(--muted);background:var(--panel);border-radius:16px}.foot{margin-top:24px;color:var(--muted);font-size:11px;line-height:1.5}</style></head><body><div class="wrap"><header><h1>⚽ Caesar Predict</h1><div class="sub">Football prediction dashboard</div><div id="status" class="status">● CONNECTING TO LIVE DATA</div></header><nav class="filters"><button class="active" data-league="">All</button><button data-league="39">Premier League</button><button data-league="140">La Liga</button><button data-league="2">Champions League</button></nav><main id="matches"><div class="empty">Loading today's matches…</div></main><div class="foot">Predictions are statistical estimates, not guarantees. Football results are uncertain.</div></div><script>const statusEl=document.getElementById("status"),matchesEl=document.getElementById("matches");let currentLeague="";function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function pct(v){return Number.isFinite(Number(v))?Math.round(Number(v)):0}function render(rows){if(!rows.length){matchesEl.innerHTML='<div class="empty">No matches found for today.</div>';return}matchesEl.innerHTML=rows.map(m=>{const p=m.prediction,d=new Date(m.date),time=isNaN(d)?"":d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}),h=p?pct(p.home):0,x=p?pct(p.draw):0,a=p?pct(p.away):0;return `<article class="card"><div class="league">${esc(m.league)} · ${esc(m.status||"")}</div><div class="teams"><div class="team">${m.homeLogo?`<img src="${esc(m.homeLogo)}" alt="">`:""}${esc(m.home)}</div><div class="time">${esc(time)}<br>VS</div><div class="team">${m.awayLogo?`<img src="${esc(m.awayLogo)}" alt="">`:""}${esc(m.away)}</div></div><div class="pred">${p?`<div class="bars"><div class="barrow"><span>Home</span><div class="track"><div class="fill" style="width:${h}%"></div></div><b>${h}%</b></div><div class="barrow"><span>Draw</span><div class="track"><div class="fill" style="width:${x}%"></div></div><b>${x}%</b></div><div class="barrow"><span>Away</span><div class="track"><div class="fill" style="width:${a}%"></div></div><b>${a}%</b></div></div><div class="advice">${esc(p.advice||p.winner||"Prediction available")}</div>`:`<div class="time">Prediction data unavailable for this fixture.</div>`}</div></article>`}).join("")}async function load(){statusEl.textContent="● CONNECTING TO LIVE DATA";statusEl.classList.remove("ok");matchesEl.innerHTML='<div class="empty">Loading today’s matches…</div>';try{const url=currentLeague?`/api/matches?league=${encodeURIComponent(currentLeague)}`:"/api/matches";const r=await fetch(url,{cache:"no-store"}),data=await r.json();if(!r.ok)throw new Error(data.error||"Server error");statusEl.textContent="● LIVE DATA CONNECTED";statusEl.classList.add("ok");render(data)}catch(e){console.error(e);statusEl.textContent="● DATA CONNECTION ERROR";matchesEl.innerHTML=`<div class="empty">Could not load live matches.<br><small>${esc(e.message)}</small></div>`}}document.querySelectorAll("[data-league]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-league]").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentLeague=b.dataset.league;load()}));load();</script></body></html>
